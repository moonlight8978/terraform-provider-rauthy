# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: moonlight8978/actions/github-app-login@latest
        id: ghapp-auth
        with:
          app-id: ${{ vars.ASSISTANT_APP_ID }}
          app-private-key: ${{ secrets.ASSISTANT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
          token: ${{ steps.ghapp-auth.outputs.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ steps.ghapp-auth.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.ghapp-auth.outputs.bot-name }}
          GIT_AUTHOR_EMAIL: ${{ steps.ghapp-auth.outputs.bot-email }}
          GIT_COMMITTER_NAME: ${{ steps.ghapp-auth.outputs.bot-name }}
          GIT_COMMITTER_EMAIL: ${{ steps.ghapp-auth.outputs.bot-email }}
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/exec

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ steps.ghapp-auth.outputs.token }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
